services:
  api:
    build: .
    container_name: stream_api
    ports:
      - "8000:8000"
    restart: always
    depends_on:
      - mongo
      - elasticsearch
    environment:
      - MONGODB_URI=mongodb://root:root12345!!@mongodb:27017
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
      
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.0
    container_name: elasticsearch_stream
    environment:
      - node.name=elasticsearch
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ELASTIC_PASSWORD=elasticsearch123docker
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - cluster.routing.allocation.disk.watermark.low=95%
      - cluster.routing.allocation.disk.watermark.high=98%
      - cluster.routing.allocation.disk.watermark.flood_stage=99%
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
    - es_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    restart: always 

  mongo:
    image: mongo:6
    container_name: mongodb_stream
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root12345!!
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
  es_data:  
