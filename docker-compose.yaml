services:
  api:
    build: .
    container_name: agent
    ports:
      - "8002:8002"
    restart: always
    depends_on:
      - mongo
    environment:
      - MONGODB_URI=mongodb://root:root12345!!@mongodb:27018
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
      

  mongo:
    image: mongo:6
    container_name: mongodb_agent
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root12345!!
    ports:
      - "27018:27018"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
  es_data:  
